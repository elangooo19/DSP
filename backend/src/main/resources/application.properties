spring.application.name=SADMS

# ─── MariaDB Database ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sadms}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=sadms-secret-key-for-academic-project-2024-minimum-256-bits-long
jwt.expiration=86400000
